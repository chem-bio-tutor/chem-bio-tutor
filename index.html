<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f6f4">
<title>Репетитор</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f4;--card:#ffffff;--text:#2b2b2b;--text-soft:#7a7a7a;--line:#e7e5e1;
  --accent:#e8702a;--accent-soft:#fdf0e8;--green:#2e9e5b;--green-soft:#e7f6ee;
  --red:#d64545;--red-soft:#fbeaea;--gray:#b9b6b1;--gray-soft:#f0eeeb;
  --radius:14px;--shadow:0 2px 10px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:76px;font-size:15px;}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 10px;}
.topbar h1{font-size:20px;font-weight:700;margin-bottom:2px}
.topbar .sub{font-size:13px;color:var(--text-soft)}
.week-toggle{display:flex;gap:8px;margin-top:10px}
.week-toggle button{flex:1;padding:9px 10px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--text-soft);}
.week-toggle button.active{background:var(--accent);color:#fff;box-shadow:none}
.day-strip{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-soft);}
.day-pill.active{background:var(--accent);color:#fff;box-shadow:none}
.day-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.day-pill.active .dot{background:#fff}
.screen{padding:0 16px;max-width:640px;margin:0 auto}
.empty{color:var(--text-soft);font-size:14px;text-align:center;padding:30px 0}
.lesson-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .08s;}
.lesson-card:active{transform:scale(.99)}
.lesson-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lesson-time{font-size:16px;font-weight:700;color:var(--accent)}
.lesson-name{font-size:16px;font-weight:600}
.lesson-subject{font-size:13px;color:var(--text-soft);margin-top:2px}
.lesson-topic{font-size:13px;color:var(--text-soft);margin-top:6px;font-style:italic}
.lesson-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:var(--gray-soft);color:var(--gray);}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.orange{background:var(--accent-soft);color:var(--accent)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;margin-top:8px;background:var(--accent);color:#fff;border-radius:var(--radius);font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(232,112,42,.25);}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10px;font-weight:600;color:var(--text-soft);}
.tabbar button.active{color:var(--accent)}
.tabbar svg{width:24px;height:24px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h2{font-size:18px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--gray-soft);font-size:16px;color:var(--text-soft);display:flex;align-items:center;justify-content:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15px;font-family:inherit;color:var(--text);}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;background:var(--gray-soft);color:var(--text-soft);}
.pill.active{background:var(--accent);color:#fff}
.pill.green{background:var(--green);color:#fff}
.pill.red{background:var(--red);color:#fff}
.pill.outline{background:transparent;border:1.5px solid var(--line)}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;margin-top:6px;}
.btn-danger{width:100%;padding:14px;border-radius:12px;background:var(--red-soft);color:var(--red);font-size:15px;font-weight:700;margin-top:8px;}
.btn-ghost{width:100%;padding:14px;border-radius:12px;background:var(--gray-soft);color:var(--text);font-size:15px;font-weight:600;margin-top:8px;}
.student-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;cursor:pointer;}
.student-top{display:flex;justify-content:space-between;align-items:baseline}
.student-name{font-size:16px;font-weight:700}
.student-class{font-size:12px;color:var(--accent);font-weight:600}
.student-line{font-size:13px;color:var(--text-soft);margin-top:6px}
.student-stats{display:flex;gap:12px;margin-top:8px;font-size:13px}
.student-stats span{color:var(--text-soft)}
.student-stats b{color:var(--text)}
.student-debt{font-size:14px;font-weight:700;margin-top:8px}
.student-debt.ok{color:var(--green)}
.student-debt.bad{color:var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text-soft);padding:6px 0}
.cal-day{aspect-ratio:1;border-radius:10px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;}
.cal-day.other{background:transparent;box-shadow:none;color:var(--gray)}
.cal-day.today{background:var(--accent);color:#fff}
.cal-day .cnt{font-size:9px;color:var(--accent);font-weight:700;margin-top:1px}
.cal-day.today .cnt{color:#fff}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cal-head button{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:16px}
.stat-period{display:flex;gap:8px;margin-bottom:14px}
.stat-period button{flex:1;padding:10px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--text-soft);}
.stat-period button.active{background:var(--accent);color:#fff;box-shadow:none}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stat-box .num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-box .lbl{font-size:12px;color:var(--text-soft);margin-top:4px}
.settings-row{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.settings-row .lbl{font-size:14px;font-weight:600}
.settings-row .val{font-size:14px;color:var(--text-soft)}
.settings-row input{width:110px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:14px;text-align:right;font-family:inherit;}
.adv-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.adv-row .nm{font-size:14px;font-weight:600}
.adv-row input{width:70px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:15px;text-align:center;font-family:inherit;}
.hist-block{margin-bottom:18px}
.hist-title{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.hist-line{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--text)}
.hist-line .sub{color:var(--text-soft);font-size:12px;margin-top:2px}
.exam-badge{background:var(--red-soft);color:var(--red);font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;display:inline-block;margin-top:4px;}
.exam-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:6px;background:var(--bg);border-radius:8px;}
.exam-row input[type="date"]{border:none;background:transparent;font-size:13px;width:130px;padding:0;}
.prob-row{display:flex;gap:8px;margin-top:6px;align-items:center;font-size:13px;}
</style>
</head>
<body>

<div id="screen-schedule">
  <div class="topbar">
    <h1 id="sched-title">Расписание</h1>
    <div class="sub" id="sched-date"></div>
    <div class="week-toggle">
      <button id="wk-this" class="active">Эта неделя</button>
      <button id="wk-next">Следующая неделя</button>
    </div>
    <div class="day-strip" id="day-strip"></div>
  </div>
  <div class="screen" id="schedule-body"></div>
</div>

<div id="screen-students" class="hidden">
  <div class="topbar"><h1>Ученики</h1></div>
  <div class="screen" id="students-body"></div>
</div>

<div id="screen-calendar" class="hidden">
  <div class="topbar"><h1>Календарь</h1></div>
  <div class="screen">
    <div class="cal-head">
      <button id="cal-prev">‹</button>
      <div style="font-size:16px;font-weight:700" id="cal-title"></div>
      <button id="cal-next">›</button>
    </div>
    <div class="cal-grid" id="cal-dow"></div>
    <div class="cal-grid" id="cal-days"></div>
  </div>
</div>

<div id="screen-stats" class="hidden">
  <div class="topbar"><h1>Статистика</h1></div>
  <div class="screen">
    <div class="stat-period" id="stat-period">
      <button data-p="week">Неделя</button>
      <button data-p="month" class="active">Месяц</button>
      <button data-p="year">Год</button>
    </div>
    <div class="stat-grid" id="stats-body"></div>
  </div>
</div>

<div id="screen-settings" class="hidden">
  <div class="topbar"><h1>Настройки</h1></div>
  <div class="screen" id="settings-body"></div>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="schedule" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Расписание</button>
  <button data-tab="students"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/><circle cx="17" cy="9" r="2.5"/><path d="M22 21v-1.5a4 4 0 0 0-3-3.8"/></svg>Ученики</button>
  <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 3v18M15 3v18"/></svg>Календарь</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Статистика</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
</nav>

<div id="overlay" class="overlay hidden"><div class="modal" id="modal"></div></div>

<script>
const DEFAULT_SETTINGS = { price:1500, tutorName:"Дмитрий", startYear:2026, endYear:2027 };

const STUDENTS = [
  { id:"yulia", name:"Юлия", class:"ОГЭ",
    subjects:[
      { name:"Химия", days:[2,6], time:"14:00", totalDone:19,
        topics:["Строение атома","Закон Менделеева","Химические связи","Степени окисления с механизмами","Номенклатура веществ","Типы химических реакций","Основные оксиды","Кислотные оксиды","Количества вещества","Задачи по уравнению","Практика","Амфотерные","Кислоты","Кислоты 2","Соли 1","Соли 2 с раздражения нитратов","Практика хим свойств","ТЭД","Гидролиз"], next:"Классификация хим реакций", prepaidWeek:true },
      { name:"Биология", days:[4,7], time:"14:00", totalDone:17,
        topics:["Химия клетки","Строение клетки","Строение клетки с аппаратом Гольджи","Энергообмен","Фотосинтез","Митоз","Мейоз","Онтогенез","Изменчивость с наследственной","Бактерии","Бактерии с профилактики","Одноклеточные","Одноклеточные с лейшмании","Кишечнополостные","Круглые и кольчатые","Кольчатые черви","Практика","Членистоногие","Моллюски","Хордовые","Отличия рыб"], next:"Птицы", prepaidWeek:true }
    ]},
  { id:"yana_f", name:"Яна Ф.", class:"ЕГЭ 11",
    subjects:[
      { name:"Химия", days:[1,5], time:"16:00", totalDone:11,
        topics:["Строение атома","Закон Менделеева","Химические связи","Степени окисления","Классификация неорганических веществ","Номенклатура кислотных остатков","Кислотные оксиды","Задачи на количество","Основания","Основания с 9 свойствами","Амфотерные оксиды","Кислоты 2","Соли","Соли 2","Рио","Гидролиз","Электролиз"], next:"ОВР", prepaidWeek:true },
      { name:"Биология", days:[3,6], time:"18:00", timeSat:"12:00", totalDone:13,
        topics:["Строение клетки с вакуолями","Синтез белка с комплементарности","Энергообмен","Фотосинтез","Митоз","Практика","Онтогенез с постэмбрионального этапа","Изменчивость","Селекция","Биотехнологии","Вирусы и бактерии","Бактерии","Грибы","Методы генетики","Мендель с анализирующего","Теория Моргана с 6 задачи","Взаимодействие генов","Задачи генетика"], next:"Таксономия с хордовых", prepaidWeek:true }
    ]},
  { id:"yana_k", name:"Яна К.", class:"ЕГЭ 10",
    subjects:[
      { name:"Химия", days:[3], time:"16:00", totalDone:7,
        topics:["Повторение","Степени окисления","СО с формул веществ","Кристаллические решётки","Классификация с оксидов","Номенклатура с гидроксидов","Типы хим реакций","Основные оксиды"], next:"Кислотные оксиды", prepaidWeek:false },
      { name:"Биология", days:[7], time:"12:00", totalDone:7,
        topics:["Повторение","Вещества с углеводов","Вещества с функций белков","Царства","Строение клетки","Строение клетки митохондрии","Биосинтез белка","Задача 2 из БСБ"], next:"БСБ с 14 задачи", prepaidWeek:false }
    ]},
  { id:"karina", name:"Карина", class:"ОГЭ",
    subjects:[
      { name:"Химия", days:[1], time:"14:00", totalDone:7,
        topics:["Закон Менделеева","СО с формул","Номенклатура","Типы химических реакций","Кислотные оксиды","Основания"], next:"НОГ (нерастворимые основные гидроксиды)", prepaidWeek:false },
      { name:"Биология", days:[3], time:"14:00", totalDone:6,
        topics:["Вещества с липидов","Царства","Строение клетки с ЭПС","Энергообмен","Фотосинтез","Митоз","Мейоз"], next:"Гаметогенез", prepaidWeek:false }
    ]}
];

let DB = { students: [], lessons: [], settings: {...DEFAULT_SETTINGS}, topics: {}, exams: {}, probes: {} };

function saveDB(){ localStorage.setItem('tutorDB', JSON.stringify(DB)); }
function loadDB(){ const raw = localStorage.getItem('tutorDB'); if(raw){ try{ DB = JSON.parse(raw); if(!DB.exams) DB.exams = {}; if(!DB.probes) DB.probes = {}; return true; }catch(e){} } return false; }

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function getMonday(d){ const t = new Date(d); t.setHours(0,0,0,0); const day = t.getDay(); const diff = (day===0? -6 : 1-day); t.setDate(t.getDate()+diff); return t; }
function addDays(d,n){ const t=new Date(d); t.setDate(t.getDate()+n); return t; }
function parseDateKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
const WEEKDAY_FULL = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function fmtDateFull(d){ return WEEKDAY_FULL[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()]; }

function getNextTopic(studentId, subject){
  const key = studentId+"|"+subject;
  return (DB.topics[key] && DB.topics[key].next) || "";
}

function packTopics(topics, targetCount){
  if (targetCount <= 0) return [];
  if (topics.length <= targetCount) return topics;
  const result = [];
  const step = topics.length / targetCount;
  for (let i = 0; i < targetCount; i++) {
    let start = Math.round(i * step);
    let end = Math.round((i + 1) * step);
    if (end <= start) end = start + 1;
    result.push(topics.slice(start, end).join(", "));
  }
  return result;
}

function seedData(){
  DB = { students: [], lessons: [], settings: {...DEFAULT_SETTINGS}, topics: {}, exams: {}, probes: {} };
  DB.students = JSON.parse(JSON.stringify(STUDENTS));
  DB.students.forEach(s=>{
    s.subjects.forEach(sub=>{
      const key = s.id+"|"+sub.name;
      DB.topics[key] = { passed:[...sub.topics], next: sub.next };
      DB.exams[key] = "";
      DB.probes[key] = [];
    });
  });
  
  const today = new Date(); today.setHours(0,0,0,0);
  const thisMonday = getMonday(today);

  function createPastLessons(stId, subName, dow, time, topicsList, totalDone) {
    const packed = packTopics(topicsList, totalDone);
    let cur = new Date(thisMonday);
    let offset = (dow - cur.getDay() + 7) % 7;
    if (offset === 0) offset = 7;
    cur = addDays(cur, offset);
    
    for (let i = packed.length - 1; i >= 0; i--) {
      cur = addDays(cur, -7);
      const key = dateKey(cur);
      DB.lessons.push({
        id: "past_"+stId+"_"+subName+"_"+key,

  createPastLessons("yana_k", "Биология", 7, "12:00", yanaK.subjects[1].topics, 7);

    cur = addDays(cur, -7);
  }

    cur = addDays(cur, -7);
  }

  saveDB();
}

function isTimeBusy(date, time, duration, excludeId){
  const newStart = timeToMins(time);
  const newEnd = newStart + duration;
  return DB.lessons.some(l => {
    if (l.date !== date || l.canceled || l.id === excludeId) return false;
    const lStart = timeToMins(l.time);
    const lEnd = lStart + (l.duration || 90);
    return newStart < lEnd && newEnd > lStart;
  });
}

function timeToMins(t){
  const [h,m] = t.split(':').map(Number);
  return h * 60 + m;
}

function generateLessonsInRange(fromDate, toDate){
  const yearEnd = new Date(DB.settings.endYear, 5, 30);
  const today = new Date(); today.setHours(0,0,0,0);
  const thisMonday = getMonday(today);
  const nextMonday = addDays(thisMonday, 7);
  let added = false;

  DB.students.forEach(st=>{
    st.subjects.forEach(sub=>{
      sub.days.forEach(dow=>{
        const dayIndex = dow===7?0:dow;
        let start = new Date(fromDate); start.setHours(0,0,0,0);
        let offset = (dayIndex - start.getDay()+7)%7;
        let cur = addDays(start, offset);
        
        while(cur <= toDate && cur <= yearEnd){
          let time = sub.time;
          if(st.id==="yana_f" && sub.name==="Биология" && dow===6 && sub.timeSat) time = sub.timeSat;
          const key = dateKey(cur);
          
          if (cur < thisMonday && !DB.lessons.find(l=>l.studentId===st.id && l.subject===sub.name && l.date===key)) {
             cur = addDays(cur, 7);
             continue;
          }

          const exists = DB.lessons.find(l=>l.studentId===st.id && l.subject===sub.name && l.date===key);
          if(!exists && !isTimeBusy(key, time, 90)){
            const isPrepaid = sub.prepaidWeek && cur < nextMonday;
            DB.lessons.push({ 
              id:"auto_"+st.id+"_"+sub.name+"_"+key, 
              studentId:st.id, subject:sub.name, date:key, time, duration:90,
              topic:"", note:"", hw:"", nextHw:"", 
              done:false, paid:isPrepaid, canceled:false, isExtra:false 
            });
            added = true;
          }
          cur = addDays(cur, 7);
        }
      });
    });
  });
  if(added) saveDB();
}

let currentWeekOffset = 0;
let currentDayOffset = 0;

function renderSchedule(){
  const today = new Date(); today.setHours(0,0,0,0);
  const baseMonday = addDays(getMonday(today), currentWeekOffset*7);
  const viewingDate = addDays(baseMonday, currentDayOffset);
  document.getElementById('sched-date').textContent = fmtDateFull(viewingDate);

  const strip = document.getElementById('day-strip');
  strip.innerHTML = "";
  const names = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  for(let i=0;i<7;i++){
    const d = addDays(baseMonday, i);
    const btn = document.createElement('button');
    btn.className = "day-pill" + (i===currentDayOffset?" active":"");
    btn.innerHTML = names[i] + (hasLessonsOn(d) ? '<span class="dot"></span>' : '');
    btn.onclick = ()=>{ currentDayOffset = i; renderSchedule(); };
    strip.appendChild(btn);
  }

  const body = document.getElementById('schedule-body');
  const key = dateKey(viewingDate);
  let lessons = DB.lessons.filter(l=>l.date===key && !l.canceled).sort((a,b)=> a.time.localeCompare(b.time));
  body.innerHTML = "";
  if(lessons.length===0) body.innerHTML = '<div class="empty">Нет уроков на этот день</div>';
  else lessons.forEach(l=> body.appendChild(lessonCard(l)));
  const add = document.createElement('button');
  add.className = "add-btn"; add.textContent = "+ Добавить урок";
  add.onclick = ()=> openAddLesson(viewingDate);
  body.appendChild(add);
}

function hasLessonsOn(d){ const key = dateKey(d); return DB.lessons.some(l=>l.date===key && !l.canceled); }

function lessonCard(l){
  const st = DB.students.find(s=>s.id===l.studentId);
  const card = document.createElement('div');
  card.className = "lesson-card";
  const now = new Date();
  const lessonDate = parseDateKey(l.date);
  const lessonTime = new Date(lessonDate.getFullYear(), lessonDate.getMonth(), lessonDate.getDate(), +l.time.split(':')[0], +l.time.split(':')[1]);
  const started = now >= lessonTime;
  const isFuture = !started;
  
  let badges = "";
  if(l.paid) badges += '<span class="badge green">Оплачен</span>';
  else if(isFuture) badges += '<span class="badge">Не оплачен</span>';
  else badges += '<span class="badge red">Не оплачен</span>';
  
  if(l.done) badges += '<span class="badge green">Проведён</span>';
  else if(isFuture) badges += '<span class="badge">Не проведён</span>';
  else badges += '<span class="badge red">Не проведён</span>';

  const examKey = l.studentId+"|"+l.subject;
  const examDateStr = DB.exams[examKey];
  if(examDateStr){
    const examDate = parseDateKey(examDateStr);
    const diffDays = Math.ceil((examDate - now) / (1000*60*60*24));
    if(diffDays >= 0 && diffDays <= 15){
      badges += `<span class="badge red">Экзамен через ${diffDays} дн.</span>`;
    }
  }

  card.innerHTML = `
    <div class="lesson-top"><div class="lesson-time">${l.time}</div><div class="lesson-name">${st?st.name:""}</div></div>
    <div class="lesson-subject">${l.subject} · ${st?st.class:""}</div>
    <div class="lesson-topic">${l.topic||"Тема не задана"}</div>
    <div class="lesson-badges">${badges}</div>`;
  card.onclick = ()=> openLesson(l.id);
  return card;
}

    <button class="btn-primary" id="p-save">Сохранить</button>`;

    b.textContent = l.done?'Проведён':'Не проведён';
  };
  document.getElementById('p-paid').onclick = ()=>{
    l.paid = !l.paid;
    const b = document.getElementById('p-paid');
    b.className = "pill "+(l.paid?'green':(started?'red':''));
    b.textContent = l.paid?'Оплачен':'Не оплачен';
  };
  document.getElementById('p-move').onclick = ()=> openMoveLesson(l.id);
  
  document.getElementById('p-cancel').onclick = ()=>{
    const mm = document.getElementById('modal');
    mm.innerHTML = `
      <div class="modal-head"><h2>Отменить урок?</h2></div>
      <div style="font-size:14px;color:var(--text-soft);margin-bottom:16px">Урок исчезнет из расписания.</div>
      <button class="btn-danger" id="cancel-yes">Да, отменить</button>
      <button class="btn-ghost" id="cancel-no">Нет, назад</button>
    `;
    document.getElementById('cancel-yes').onclick = ()=>{
      l.canceled = true; saveDB(); closeModal(); renderSchedule();
    };
    document.getElementById('cancel-no').onclick = ()=> openLesson(l.id);
  };

  document.getElementById('p-save').onclick = ()=>{
    const newTopic = document.getElementById('m-topic').value.trim();
    const oldTopic = l.topic||"";
    const newHw = document.getElementById('m-hw').value.trim();
    const oldHw = l.hw||"";
    
    l.topic = newTopic;
    l.note = document.getElementById('m-note').value.trim();
    l.hw = newHw;

    const key = l.studentId+"|"+l.subject;
    
    // Перенос темы
    if(newTopic && newTopic !== oldTopic){
      if(!DB.topics[key]) DB.topics[key] = {passed:[], next:""};
      if(oldTopic) DB.topics[key].passed.push(oldTopic);
      DB.topics[key].next = newTopic;
      
      const nextLesson = DB.lessons
        .filter(x => x.studentId === l.studentId && x.subject === l.subject && x.date > l.date && !x.canceled)
        .sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time))[0];
      if(nextLesson) {
        nextLesson.topic = newTopic;
      }
    }

    // Перенос ДЗ
    if(newHw && newHw !== oldHw){
      const nextLesson = DB.lessons
        .filter(x => x.studentId === l.studentId && x.subject === l.subject && x.date > l.date && !x.canceled)
        .sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time))[0];
      if(nextLesson) {
        nextLesson.nextHw = newHw;
      }
    } else if (!newHw && oldHw) {
      const nextLesson = DB.lessons
        .filter(x => x.studentId === l.studentId && x.subject === l.subject && x.date > l.date && !x.canceled)
        .sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time))[0];
      if(nextLesson) {
        nextLesson.nextHw = "";
      }
    }

    saveDB(); closeModal(); renderSchedule();
  };
}

      document.getElementById('a-perm').onclick = ()=>{ sel.type="perm"; document.getElementById('a-perm').classList.add('active'); document.getElementById('a-once').classList.remove('active'); };

      m.innerHTML = `
        <div class="modal-head"><h2>${sel.type==="once"?"Разовый урок":"Постоянный урок"}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>

        <button class="btn-primary" id="a-save">Добавить</button>

        const dur = parseInt(document.getElementById('a-dur').value) || 90;
        if(!d || !t){ alert("Укажи дату и время"); return; }

function renderStudents(){

    card.className = "student-card";
    let totalDebt = 0;

    let totalPaid = 0;
    st.subjects.forEach(sub=>{
      const lessons = DB.lessons.filter(l=>l.studentId===st.id && l.subject===sub.name && !l.canceled);
      const doneNotPaid = lessons.filter(l=>l.done && !l.paid).length;
      const paidNotDone = lessons.filter(l=>!l.done && l.paid).length;

    let debtHtml = totalDebt > 0 ? `<div class="student-debt bad">Долг: ${totalDebt} ₽</div>` : totalDebt < 0 ? `<div class="student-debt ok">Аванс: ${-totalDebt} ₽</div>` : `<div class="student-debt ok">Долгов нет</div>`;
    const subjLine = st.subjects.map(su=>`${su.name}: ${getNextTopic(st.id,su.name)}`).join(" · ");
    card.innerHTML = `
      <div class="student-top"><div class="student-name">${st.name}</div><div class="student-class">${st.class}</div></div>
      <div class="student-line">${subjLine}</div>
      <div class="student-stats"><span>Проведено: <b>${totalDone}</b></span><span>Оплачено: <b>${totalPaid}</b></span></div>

    card.onclick = ()=> openStudent(st.id);
    body.appendChild(card);
  });

    html += `<div class="hist-block">
      <div class="hist-title">${sub.name} ${examBadge}</div>
      <div style="font-size:13px;color:var(--text-soft);margin-bottom:4px">Следующая тема: <b>${t.next||"—"}</b></div>
      <div style="font-size:13px;color:var(--text-soft);margin-bottom:4px">Проведено: <b>${doneCnt}</b></div>
      <div style="font-size:13px;color:var(--text-soft);margin-bottom:8px">${balance>=0?'Аванс':'Долг'}: <b>${Math.abs(balance)} ₽</b></div>
      
      <div class="exam-row">
        <span style="font-size:12px">Экзамен:</span>
        <input type="date" value="${examDateStr}" onchange="DB.exams['${key}']=this.value; saveDB(); openStudent('${st.id}');">
      </div>

      <div style="margin-top:10px;font-size:13px;font-weight:600;">Пробники:</div>
      ${probesHtml}
      <div class="prob-row" style="margin-top:6px;">
        <input type="date" id="pr-date-${key}" style="width:120px;padding:6px;border-radius:6px;border:1px solid var(--line);">
        <input type="number" id="pr-score-${key}" placeholder="Балл" style="width:60px;padding:6px;border-radius:6px;border:1px solid var(--line);">
        <button class="btn-primary" style="width:auto;padding:6px 12px;margin:0;font-size:13px" onclick="addProbe('${key}', '${st.id}')">+</button>
      </div>

      <div style="margin-top:14px;font-size:13px;color:var(--text-soft)">История:</div>`;
      
    lessons.slice(0,50).forEach(l=>{
      html += `<div class="hist-line">${l.date} · ${l.time} · ${l.topic||"—"} ${l.done?'✅':''} ${l.paid?'💰':''}
        ${l.hw?`<div class="sub">ДЗ: ${l.hw}</div>`:''}</div>`;
    });
    html += `</div>`;
  });
  
  m.innerHTML = html;
  ov.classList.remove('hidden');
  document.getElementById('st-adv').onclick = ()=> openAdvance(st.id);
}

window.addProbe = function(key, stId) {
  const date = document.getElementById('pr-date-'+key).value;
  const score = document.getElementById('pr-score-'+key).value;
  if(!date || !score) return;
  if(!DB.probes[key]) DB.probes[key] = [];
  DB.probes[key].push({date, score});
  DB.probes[key].sort((a,b) => a.date.localeCompare(b.date));
  saveDB();
  openStudent(stId);
};

window.removeProbe = function(key, idx) {
  DB.probes[key].splice(idx, 1);
  saveDB();
};

function openAdvance(studentId){
  const st = DB.students.find(s=>s.id===studentId);
  const ov = document.getElementById('overlay');
  const m = document.getElementById('modal');
  let html = `<div class="modal-head"><h2>Аванс · ${st.name}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="font-size:13px;color:var(--text-soft);margin-bottom:14px">Укажи, сколько уроков оплачено по каждому предмету. Оплата закроет сначала долги, потом будущие уроки.</div>`;
  st.subjects.forEach((sub,i)=>{
    html += `<div class="adv-row"><div class="nm">${sub.name}</div><input type="number" min="0" value="0" id="adv-${i}"></div>`;
  });
  html += `<button class="btn-primary" id="adv-save" style="margin-top:14px">Применить</button>
           <button class="btn-ghost" onclick="openStudent('${studentId}')">Назад</button>`;
  m.innerHTML = html;
  document.getElementById('adv-save').onclick = ()=>{
    st.subjects.forEach((sub,i)=>{
      const n = parseInt(document.getElementById('adv-'+i).value)||0;
      if(n<=0) return;
      let unpaid = DB.lessons.filter(l=>l.studentId===studentId && l.subject===sub.name && !l.canceled && !l.paid)
        .sort((a,b)=> a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
      for(let k=0; k<n && k<unpaid.length; k++){ unpaid[k].paid = true; }
    });
    saveDB(); openStudent(studentId); renderStudents();
  };
}

/* ============================================================
   КАЛЕНДАРЬ
   ============================================================ */
let calOffset = 0;
function renderCalendar(){
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth()+calOffset, 1);
  document.getElementById('cal-title').textContent = MONTHS[base.getMonth()].charAt(0).toUpperCase()+MONTHS[base.getMonth()].slice(1)+" "+base.getFullYear();
  document.getElementById('cal-dow').innerHTML = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<div class="cal-dow">${x}</div>`).join("");
  const daysEl = document.getElementById('cal-days'); daysEl.innerHTML = "";
  const firstDow = (base.getDay()===0?6:base.getDay()-1);
  const daysInMonth = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  for(let i=0;i<firstDow;i++){ const d = document.createElement('div'); d.className="cal-day other"; daysEl.appendChild(d); }
  for(let day=1; day<=daysInMonth; day++){
    const dt = new Date(base.getFullYear(), base.getMonth(), day);
    const key = dateKey(dt);
    const cnt = DB.lessons.filter(l=>l.date===key && !l.canceled).length;
    const isToday = dateKey(now)===key;
    const el = document.createElement('div');
    el.className = "cal-day" + (isToday?" today":"");
    el.innerHTML = day + (cnt?`<span class="cnt">${cnt}</span>`:"");
    el.onclick = ()=>{ 
      currentWeekOffset = Math.round((getMonday(dt)-getMonday(now))/604800000); 
      currentDayOffset = (dt.getDay()===0?6:dt.getDay()-1); 
      _origShowTab('schedule'); 
    };
    daysEl.appendChild(el);
  }
}

/* ============================================================
   СТАТИСТИКА
   ============================================================ */
let statPeriod = "month";
function renderStats(){
  document.querySelectorAll('#stat-period button').forEach(b=> b.classList.toggle('active', b.dataset.p===statPeriod));
  const now = new Date(); now.setHours(23,59,59,999);
  let from;
  if(statPeriod==="week") from = getMonday(now);
  else if(statPeriod==="month") from = new Date(now.getFullYear(), now.getMonth(), 1);
  else from = new Date(now.getFullYear(), 0, 1);
  const lessons = DB.lessons.filter(l=>{ if(l.canceled) return false; const d = parseDateKey(l.date); return d>=from && d<=now; });
  const done = lessons.filter(l=>l.done).length;
  const paid = lessons.filter(l=>l.paid).length;
  const earned = paid * DB.settings.price;
  const debt = lessons.filter(l=>l.done && !l.paid).length * DB.settings.price;
  document.getElementById('stats-body').innerHTML = `
    <div class="stat-box"><div class="num">${done}</div><div class="lbl">Проведено уроков</div></div>
    <div class="stat-box"><div class="num">${paid}</div><div class="lbl">Оплачено уроков</div></div>
    <div class="stat-box"><div class="num">${earned} ₽</div><div class="lbl">Заработано</div></div>
    <div class="stat-box"><div class="num">${debt} ₽</div><div class="lbl">Долги</div></div>`;
}

/* ============================================================
   НАСТРОЙКИ
   ============================================================ */
function renderSettings(){
  const body = document.getElementById('settings-body');
  body.innerHTML = `
    <div class="settings-row"><div class="lbl">Стоимость урока</div><input type="number" id="s-price" value="${DB.settings.price}"></div>
    <div class="settings-row"><div class="lbl">Имя репетитора</div><input type="text" id="s-name" value="${DB.settings.tutorName}" style="width:150px"></div>
    <div class="settings-row"><div class="lbl">Учебный год до</div><input type="number" id="s-end" value="${DB.settings.endYear}"></div>
    <button class="btn-primary" id="s-save">Сохранить настройки</button>
    <button class="btn-ghost" id="s-export">📤 Экспорт данных</button>
    <button class="btn-ghost" id="s-import">📥 Импорт данных</button>
    <button class="btn-danger" id="s-reset">Очистить все данные</button>`;
  document.getElementById('s-save').onclick = ()=>{
    DB.settings.price = +document.getElementById('s-price').value || 1500;
    DB.settings.tutorName = document.getElementById('s-name').value;
    DB.settings.endYear = +document.getElementById('s-end').value || 2027;
    saveDB(); alert("Сохранено"); renderSettings();
  };
  document.getElementById('s-export').onclick = ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="tutor-backup.json"; a.click();
  };
  document.getElementById('s-import').onclick = ()=>{
    const inp = document.createElement('input'); inp.type="file"; inp.accept=".json";
    inp.onchange = e=>{ const f = e.target.files[0]; if(!f) return; const r = new FileReader();
      r.onload = ()=>{ try{ DB = JSON.parse(r.result); saveDB(); alert("Импортировано"); showTab('schedule'); }catch(err){ alert("Ошибка файла"); } };
      r.readAsText(f); };
    inp.click();
  };
  document.getElementById('s-reset').onclick = ()=>{ if(confirm("Удалить все данные и начать заново?")){ localStorage.removeItem('tutorDB'); seedData(); generateLessonsInRange(new Date(2026,8,1), addDays(new Date(), 30)); showTab('schedule'); } };
}

/* ============================================================
   ВКЛАДКИ
   ============================================================ */
function showTab(tab){
  document.querySelectorAll('[id^="screen-"]').forEach(el=> el.classList.add('hidden'));
  document.querySelectorAll('.tabbar button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('screen-'+tab).classList.remove('hidden');
  if(tab==='schedule') renderSchedule();
  if(tab==='students') renderStudents();
  if(tab==='calendar') renderCalendar();
  if(tab==='stats') renderStats();
  if(tab==='settings') renderSettings();
}
function closeModal(){ document.getElementById('overlay').classList.add('hidden'); }

document.querySelectorAll('.tabbar button').forEach(b=>{ b.onclick = ()=> showTab(b.dataset.tab); });
document.getElementById('wk-this').onclick = ()=>{ currentWeekOffset=0; currentDayOffset=0; document.getElementById('wk-this').classList.add('active'); document.getElementById('wk-next').classList.remove('active'); renderSchedule(); };
document.getElementById('wk-next').onclick = ()=>{ currentWeekOffset=1; document.getElementById('wk-next').classList.add('active'); document.getElementById('wk-this').classList.remove('active'); renderSchedule(); };
document.getElementById('cal-prev').onclick = ()=>{ calOffset--; renderCalendar(); };
document.getElementById('cal-next').onclick = ()=>{ calOffset++; renderCalendar(); };
document.querySelectorAll('#stat-period button').forEach(b=>{ b.onclick = ()=>{ statPeriod=b.dataset.p; renderStats(); }; });
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };

/* СТАРТ */
if(!loadDB()) {
  seedData();
} else {
  generateLessonsInRange(new Date(2026,8,1), addDays(new Date(), 30));
}

const _origShowTab = showTab;
window.showTab = function(tab){
  if(tab === 'schedule'){
    const now = new Date();
    const jsDay = now.getDay();
    currentDayOffset = (jsDay === 0 ? 6 : jsDay - 1);
    currentWeekOffset = 0;
  }
  _origShowTab(tab);
};

window.showTab('schedule');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
